<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDBE10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Frase a frase · Rockin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Ubuntu:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --rk-groc:#FDBE10; --rk-tinta:#221F20; --rk-fons:#FAF8F3; --rk-suau:#F4F1EA; --rk-linia:#E2DDD3; --rk-gris:#6B6461;
  --bg:var(--rk-fons); --ink:var(--rk-tinta); --muted:var(--rk-gris); --card:#FFFFFF; --line:var(--rk-linia);
  --pad-bg:#221F20; --pad:#34302F; --pad-hi:#423D3B; --pad-ink:#FDBE10; --pad-sub:#A89F99;
  --display:'Lora',Georgia,serif; --text:'Ubuntu',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#171515; --ink:#F3EFE8; --muted:#A89F99; --card:#221F20; --line:#3A3533; --pad-bg:#0F0E0E; --pad:#2A2726; --pad-hi:#36322F; }
}
:root[data-theme="dark"]{ --bg:#171515; --ink:#F3EFE8; --muted:#A89F99; --card:#221F20; --line:#3A3533; --pad-bg:#0F0E0E; --pad:#2A2726; --pad-hi:#36322F; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:20;background:var(--rk-groc);color:var(--rk-tinta);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.topbar img{height:30px;width:auto;display:block}
.topbar h1{font-family:var(--display);font-size:19px;margin:0;font-weight:700;letter-spacing:.01em}
.topbar .grow{flex:1}
.topbar button{font:inherit;font-weight:700;font-size:14px;background:var(--rk-tinta);color:var(--rk-groc);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}

main{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px}

/* Pantalla inicial */
.drop{flex:1;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;border:2.5px dashed var(--rk-groc);border-radius:22px;padding:32px 20px;cursor:pointer;background:color-mix(in srgb,var(--rk-groc) 9%,var(--bg))}
.drop.over{background:color-mix(in srgb,var(--rk-groc) 25%,var(--bg))}
.drop .big{width:84px;height:84px;border-radius:24px;background:var(--rk-tinta);display:grid;place-items:center}
.drop .big svg{width:42px;height:42px}
.drop h2{font-family:var(--display);font-size:24px;margin:0}
.drop p{margin:0;color:var(--muted);max-width:30ch}
.drop .cta{font:inherit;font-weight:700;background:var(--rk-tinta);color:var(--rk-groc);border:0;border-radius:999px;padding:13px 26px;font-size:17px;cursor:pointer}

.busy{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);min-height:300px}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--rk-groc);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#FDECEA;color:#8A1F11;border-radius:14px;padding:12px 14px;font-size:15px}

/* Capçalera de la cançó */
.song{display:flex;align-items:center;gap:12px}
.song .name{flex:1;min-width:0}
.song .name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.song .name span{color:var(--muted);font-size:14px}

/* Launchpad */
.pad-wrap{background:var(--pad-bg);border-radius:24px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:430px){.pads{grid-template-columns:repeat(4,1fr)}}
.pad{position:relative;aspect-ratio:1;border:0;border-radius:16px;background:var(--pad);color:var(--pad-ink);font-family:var(--mono);cursor:pointer;overflow:hidden;padding:0;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);transition:transform .06s, background .15s, box-shadow .15s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad:active{transform:scale(.95)}
.pad .fill{position:absolute;inset:0;background:var(--rk-groc);transform-origin:left;transform:scaleX(var(--p,0));opacity:.0;transition:opacity .15s}
.pad .n{position:relative;font-size:clamp(26px,9vw,40px);font-weight:700;line-height:1}
.pad .t{position:absolute;left:9px;bottom:7px;font-size:11px;color:var(--pad-sub);font-weight:500}
.pad .d{position:absolute;right:9px;bottom:7px;font-size:11px;color:var(--pad-sub);font-weight:500}
.pad .face{position:absolute;inset:0;display:grid;place-items:center}
/* en reproducció */
.pad.on{background:color-mix(in srgb,var(--rk-groc) 38%,var(--pad));box-shadow:0 0 0 2px var(--rk-groc), 0 0 22px rgba(253,190,16,.55)}
.pad.on .fill{opacity:.92}
.pad.on .n,.pad.on .t,.pad.on .d{color:var(--rk-tinta);mix-blend-mode:normal}
.pad.on .n{color:var(--rk-tinta)}
/* seleccionat per juntar */
.pad.sel{box-shadow:0 0 0 2px var(--rk-groc), inset 0 -4px 0 rgba(0,0,0,.35)}
.pad.anchor{box-shadow:0 0 0 3px var(--rk-groc), inset 0 -4px 0 rgba(0,0,0,.35)}
.pad.anchor::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--rk-groc);animation:bl 1s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}

.hint{color:var(--muted);font-size:14px;text-align:center;margin:2px 4px 0;min-height:1.4em}
.hint b{color:var(--ink)}

/* Ajust de frases */
.detail{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.detail input{flex:1;accent-color:var(--rk-groc);height:28px}

/* Barra inferior */
.dock{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px}
.dock button{flex:1;font:inherit;font-weight:700;font-size:15px;border-radius:16px;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:11px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1}
.dock button svg{width:22px;height:22px}
.dock button[aria-pressed="true"]{background:var(--rk-groc);border-color:var(--rk-groc);color:var(--rk-tinta)}
.dock button.stop{background:var(--ink);color:var(--bg)}
.dock button:disabled{opacity:.35}
.trim{display:flex;flex-direction:column;gap:14px}
.trim .song span{display:block}
.tl{position:relative;height:96px;border-radius:16px;background:var(--pad-bg);overflow:hidden;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.bars{position:absolute;inset:10px 0;display:flex;align-items:center;gap:1px;padding:0 2px}
.bars i{flex:1;background:#5A534F;border-radius:2px;min-height:2px}
.bars i.in{background:var(--rk-groc)}
.reg{position:absolute;top:0;bottom:0;background:rgba(253,190,16,.16);border-left:0;border-right:0;pointer-events:none}
.h{position:absolute;top:0;bottom:0;width:30px;margin-left:-15px;display:flex;justify-content:center;cursor:ew-resize}
.h span{width:4px;height:100%;background:var(--rk-groc);border-radius:2px;position:relative}
.h span::before{content:"";position:absolute;top:50%;left:50%;width:18px;height:34px;margin:-17px 0 0 -9px;background:var(--rk-groc);border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none;box-shadow:0 0 6px rgba(255,255,255,.6)}
.tlt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:-8px}
.tp{display:flex;align-items:center;justify-content:center;gap:12px}
.round{width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.round svg{width:28px;height:28px}
.pill{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.pill.wide{width:100%;padding:11px}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk{display:flex;flex-direction:column;gap:8px}
.mark{font:inherit;font-weight:700;font-size:15px;line-height:1.2;min-height:58px;border:0;border-radius:16px;background:var(--rk-groc);color:var(--rk-tinta);padding:10px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.mark:active{transform:scale(.97)}
.nud{display:flex;align-items:center;justify-content:space-between;gap:6px}
.nud b{font-family:var(--mono);font-size:15px}
.nud button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 9px;cursor:pointer}
.go{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:18px;background:var(--ink);color:var(--rk-groc);padding:16px;cursor:pointer}
.link{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.lib h2{font-family:var(--display);font-size:20px;margin:0 0 10px}
#libList{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item .open{flex:1;min-width:0;text-align:left;font:inherit;color:var(--ink);background:none;border:0;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px}
.item .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--rk-tinta);color:var(--rk-groc);display:grid;place-items:center;font-family:var(--mono);font-weight:700}
.item .tx{min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:13px;color:var(--muted)}
.item .del{flex:none;font:inherit;font-size:13px;font-weight:700;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);padding:0 14px;cursor:pointer;min-width:52px}
.item .del.sure{background:#C0392B;color:#fff}
.drop.small{flex:none;min-height:0;padding:20px;gap:8px;flex-direction:row;flex-wrap:wrap}
.drop.small .big,.drop.small p{display:none}
.drop.small h2{font-size:18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--rk-tinta);color:var(--rk-groc);font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 8px}
.foot a{color:inherit}
</style>
</head>

<script>
'use strict';
const $ = id => document.getElementById(id);
const S = { ctx:null, buf:null, name:'', an:null, phrases:[], level:2,
            join:false, anchor:-1, loop:false, last:null, play:null };

// ---------- Lectura de l'àudio ----------
function getCtx(){
  if(!S.ctx){ const C = window.AudioContext||window.webkitAudioContext; S.ctx = new C(); }
  if(S.ctx.state==='suspended') S.ctx.resume();
  return S.ctx;
}
async function loadFile(f, rec){
  if(!f) return;
  stop(); show('busy'); $('busyMsg').textContent='Llegint l\'àudio…';
  try{
    const ctx = getCtx();
    const ab = await f.arrayBuffer();
    const buf = await new Promise((res,rej)=>{ const p = ctx.decodeAudioData(ab, res, rej); if(p&&p.catch) p.catch(rej); });
    S.buf = buf; S.name = rec ? rec.name : (f.name||'Cançó').replace(/\.[^.]+$/,'');
    S.blob = f; S.sid = rec ? rec.id : 's'+Date.now();
    $('busyMsg').textContent='Buscant les frases…';
    await new Promise(r=>setTimeout(r,30));
    S.an = await analyse(buf);
    S.join=false; S.anchor=-1; S.last=null; setJoin(false);
    if(rec){
      S.region = rec.region || {a:0,b:buf.duration};
      S.level = rec.level ?? 2; $('detail').value = S.level;
      detect(); show('board');
    } else {
      S.region={a:0,b:buf.duration}; S.level=2; $('detail').value=2;
      if(buf.duration > 75){ openTrim(); save(); }   // cançó sencera: primer tria el tros
      else { detect(); show('board'); }
    }
  }catch(e){
    console.error(e);
    show('drop');
    const err=$('err'); err.hidden=false;
    err.textContent='No he pogut llegir aquest fitxer. Prova amb un MP3, M4A o WAV.';
  }
}

// ---------- Anàlisi ----------
// Energia de la banda on viuen els instruments melòdics (180 Hz – 5 kHz), en trames de 10 ms.
async function analyse(buf){
  const sr = buf.sampleRate;
  let x;
  try{
    const OC = window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const off = new OC(1, buf.length, sr);
    const src = off.createBufferSource(); src.buffer = buf;
    const hp = off.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180; hp.Q.value=0.7;
    const lp = off.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5000; lp.Q.value=0.7;
    src.connect(hp); hp.connect(lp); lp.connect(off.destination); src.start();
    x = (await off.startRendering()).getChannelData(0);
  }catch(e){
    // reserva: mescla sense filtrar
    x = new Float32Array(buf.length);
    for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i++) x[i]+=d[i]/buf.numberOfChannels; }
  }
  const hop = Math.round(sr*0.01), win = hop*3;
  const cs = new Float64Array(x.length+1);
  for(let i=0;i<x.length;i++) cs[i+1]=cs[i]+x[i]*x[i];
  const n = Math.max(1, Math.floor((x.length-win)/hop)+1);
  const raw = new Float32Array(n);
  for(let i=0;i<n;i++){ const a=i*hop; raw[i]=10*Math.log10((cs[a+win]-cs[a])/win+1e-12); }
  const db = movAvg(raw,2);       // ±20 ms
  const slow = movAvg(raw,8);     // ±80 ms, per trobar valls
  const sorted = Float32Array.from(db).sort();
  const pct = p => sorted[Math.min(n-1,Math.max(0,Math.floor(p*(n-1))))];
  const floor = pct(0.08), peak = pct(0.98);
  const lmax = movMax(db,75);     // màxim local ±0,75 s
  return { sr, hop, win, n, db, slow, lmax, floor, peak, dur: buf.duration };
}
function movAvg(a,h){ const n=a.length,o=new Float32Array(n),cs=new Float64Array(n+1); for(let i=0;i<n;i++)cs[i+1]=cs[i]+a[i];
  for(let i=0;i<n;i++){const lo=Math.max(0,i-h),hi=Math.min(n,i+h+1);o[i]=(cs[hi]-cs[lo])/(hi-lo);} return o; }
function movMax(a,h){ const n=a.length,o=new Float32Array(n),dq=[]; let head=0;
  for(let j=0;j<n+h;j++){
    if(j<n){ while(dq.length>head && a[dq[dq.length-1]]<=a[j]) dq.pop(); dq.push(j); }
    const i=j-h; if(i<0) continue; if(i>=n) break;
    while(dq[head]<i-h) head++;
    o[i]=a[dq[head]];
  } return o; }

// ---------- Frases ----------
// 0 = frases llargues … 4 = frases curtes
const LEVELS = [
  {depth:20, absK:.18, gap:.40, minLen:2.0, maxLen:14},
  {depth:16, absK:.20, gap:.30, minLen:1.4, maxLen:10},
  {depth:13, absK:.22, gap:.22, minLen:1.0, maxLen:7},
  {depth:10, absK:.25, gap:.16, minLen:.7,  maxLen:5},
  {depth:8,  absK:.28, gap:.12, minLen:.5,  maxLen:3.5},
];
function detect(){
  const A=S.an, L=LEVELS[S.level], fps=1/0.01;
  const R=S.region||{a:0,b:A.dur};
  const i0=Math.max(0,Math.floor(R.a*fps)), i1=Math.min(A.n,Math.ceil(R.b*fps));
  // llindars calculats només dins del tros triat
  const sub=Float32Array.from(A.db.subarray(i0,Math.max(i0+1,i1))).sort();
  const pct=p=>sub[Math.min(sub.length-1,Math.max(0,Math.floor(p*(sub.length-1))))];
  const floor=pct(0.08), peak=pct(0.98);
  const thr = floor + L.absK*(peak-floor);
  const act = new Uint8Array(A.n);
  for(let i=i0;i<i1;i++) act[i] = (A.db[i]>thr && A.db[i]>A.lmax[i]-L.depth) ? 1:0;
  // trams actius
  let seg=[]; let s=-1;
  for(let i=0;i<=A.n;i++){
    const on = i<A.n && act[i];
    if(on && s<0) s=i;
    if(!on && s>=0){ seg.push([s,i]); s=-1; }
  }
  // uneix silencis curts (articulacions, respiracions breus)
  const gapF = L.gap*fps;
  seg = mergeIf(seg, (a,b)=> b[0]-a[1] < gapF);
  // treu sorolls molt curts i aïllats
  seg = seg.filter((g,k)=>{
    if(g[1]-g[0] >= .25*fps) return true;
    const pv=seg[k-1], nx=seg[k+1];
    return (pv && g[0]-pv[1]<.6*fps) || (nx && nx[0]-g[1]<.6*fps);
  });
  // si no hi ha res a dalt (tot molt pla), parteix el tot
  if(!seg.length) seg=[[i0,i1]];
  // frases massa llargues: talla per la vall més fonda
  let out=[]; for(const g of seg) out.push(...splitLong(g,L));
  // frases massa curtes: enganxa-les a la veïna més propera
  out = absorbShort(out, L.minLen*fps, 1.0*fps);
  // a segons, amb marges
  const sec = i => i*A.hop/A.sr;
  const ph = out.map(([a,b])=>({ s: Math.max(R.a, sec(a)-0.05), e: Math.min(R.b, sec(b)+A.win/A.sr+0.15) }));
  for(let k=1;k<ph.length;k++){ if(ph[k].s < ph[k-1].e){ const m=(ph[k].s+ph[k-1].e)/2; ph[k-1].e=m; ph[k].s=m; } }
  S.phrases = ph; S.anchor=-1; S.last=null;
  render(); save();
}
function mergeIf(seg, test){
  const o=[]; for(const g of seg){ const p=o[o.length-1]; if(p && test(p,g)) p[1]=g[1]; else o.push([g[0],g[1]]); } return o;
}
function splitLong(g,L){
  const A=S.an, fps=100, len=(g[1]-g[0])/fps;
  if(len <= L.maxLen) return [g];
  const m = Math.max(Math.round(1.2*fps), Math.round((g[1]-g[0])*0.2));
  let best=-1, bv=Infinity;
  for(let i=g[0]+m;i<g[1]-m;i++){
    // vall: energia lenta respecte al màxim local; afavoreix el centre
    const c = Math.abs((i-g[0])/(g[1]-g[0])-0.5);
    const v = A.slow[i]-A.lmax[i] + c*6;
    if(v<bv){ bv=v; best=i; }
  }
  if(best<0) return [g];
  return [...splitLong([g[0],best],L), ...splitLong([best,g[1]],L)];
}
function absorbShort(seg, minF, reachF){
  let changed=true;
  while(changed && seg.length>1){
    changed=false;
    for(let k=0;k<seg.length;k++){
      const g=seg[k]; if(g[1]-g[0] >= minF) continue;
      const pv=seg[k-1], nx=seg[k+1];
      const dp = pv ? g[0]-pv[1] : Infinity, dn = nx ? nx[0]-g[1] : Infinity;
      if(Math.min(dp,dn) > reachF) continue;
      if(dp<=dn){ pv[1]=g[1]; } else { nx[0]=g[0]; }
      seg.splice(k,1); changed=true; break;
    }
  }
  return seg;
}

// ---------- Pantalla ----------
function show(which){
  $('drop').hidden = which!=='drop';
  if(which==='drop') renderLib(); else $('lib').hidden=true;
  $('busy').hidden = which!=='busy';
  $('board').hidden = which!=='board';
  $('trim').hidden = which!=='trim';
  $('dock').hidden = which!=='board';
  $('foot').hidden = which!=='board';
  $('bNew').hidden = which!=='board' && which!=='trim';
  if(which!=='drop') $('err').hidden=true;
}
const fmtT = t => { const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); };
const fmtD = t => t.toFixed(1).replace('.',',')+' s';
function render(){
  $('songName').textContent = S.name;
  const R=S.region, whole = !R || (R.a<0.5 && R.b>S.an.dur-0.5);
  $('songInfo').textContent = S.phrases.length+' frases · '+(whole ? fmtT(S.an.dur) : 'de '+fmtT(R.a)+' a '+fmtT(R.b));
  $('bTrim').hidden = S.an.dur<=20;
  const box=$('pads'); box.innerHTML='';
  S.phrases.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='pad'; b.dataset.i=i;
    b.setAttribute('aria-label','Frase '+(i+1)+', '+fmtD(p.e-p.s));
    b.innerHTML='<span class="fill"></span><span class="face"><span class="n">'+(i+1)+'</span></span><span class="t">'+fmtT(p.s)+'</span><span class="d">'+fmtD(p.e-p.s)+'</span>';
    box.appendChild(b);
  });
  paintSel(); hint();
}
function hint(msg){
  const h=$('hint');
  if(msg){ h.innerHTML=msg; return; }
  if(S.join){
    h.innerHTML = S.anchor<0 ? 'Toca la <b>primera</b> frase que vols juntar.' : 'Ara toca la <b>última</b> (la '+(S.anchor+1)+' ja està triada).';
  } else h.innerHTML='Toca una frase per escoltar-la.';
}
function paintSel(){
  const r = S.last;
  document.querySelectorAll('.pad').forEach(el=>{
    const i=+el.dataset.i;
    el.classList.toggle('anchor', S.join && i===S.anchor);
    el.classList.toggle('sel', !!(r && r.b>r.a && i>=r.a && i<=r.b));
  });
}

// ---------- So ----------
function playRange(a,b){
  const ctx=getCtx(); stop(true);
  const s=S.phrases[a].s, e=S.phrases[b].e, dur=e-s;
  const src=ctx.createBufferSource(); src.buffer=S.buf;
  const g=ctx.createGain(); src.connect(g); g.connect(ctx.destination);
  const t0=ctx.currentTime+0.03, f=0.012;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(1,t0+f);
  g.gain.setValueAtTime(1,t0+dur-f); g.gain.linearRampToValueAtTime(0,t0+dur);
  src.start(t0, s, dur);
  const P={src,a,b,t0,s,dur}; S.play=P; S.last={a,b};
  src.onended=()=>{
    if(S.play!==P) return;
    clearLit(); S.play=null;
    if(S.loop){ P.timer=setTimeout(()=>{ if(!S.play && S.loop && S.last && S.last.a===a && S.last.b===b) playRange(a,b); },350); S.loopTimer=P.timer; }
    updDock();
  };
  paintSel(); updDock(); requestAnimationFrame(tick);
}
function stop(silent){
  clearTimeout(S.loopTimer);
  if(S.play){ const P=S.play; S.play=null; try{P.src.onended=null;P.src.stop();}catch(e){} }
  clearLit(); if(!silent) updDock();
}
function clearLit(){ document.querySelectorAll('.pad.on').forEach(el=>{el.classList.remove('on');el.style.removeProperty('--p');}); }
function tick(){
  const P=S.play; if(!P) return;
  const t = P.s + Math.max(0, S.ctx.currentTime-P.t0);
  const pads=$('pads').children;
  for(let i=P.a;i<=P.b;i++){
    const ph=S.phrases[i], el=pads[i]; if(!el) continue;
    const p=Math.min(1,Math.max(0,(t-ph.s)/(ph.e-ph.s)));
    const live = t>=ph.s-0.02 && t<ph.e;
    el.classList.toggle('on', live);
    el.style.setProperty('--p', p.toFixed(3));
  }
  requestAnimationFrame(tick);
}
function updDock(){
  $('bStop').disabled = !S.play && !S.loop;
  $('bAgain').disabled = !S.last;
}

// ---------- Interacció ----------
$('pads').addEventListener('click', ev=>{
  const el=ev.target.closest('.pad'); if(!el) return;
  const i=+el.dataset.i;
  if(!S.join){ playRange(i,i); hint(); return; }
  if(S.anchor<0){ S.anchor=i; S.last={a:i,b:i}; playRange(i,i); hint(); return; }
  const a=Math.min(S.anchor,i), b=Math.max(S.anchor,i);
  S.anchor=-1; playRange(a,b);
  hint(a===b ? null : 'Escoltant les frases <b>'+(a+1)+' a '+(b+1)+'</b>. Toca una altra per començar de nou.');
});
function setJoin(on){
  S.join=on; S.anchor=-1; $('bJoin').setAttribute('aria-pressed',on);
  paintSel(); hint();
}
$('bJoin').onclick=()=>setJoin(!S.join);
$('bLoop').onclick=()=>{ S.loop=!S.loop; $('bLoop').setAttribute('aria-pressed',S.loop); if(!S.loop) clearTimeout(S.loopTimer); updDock(); };
$('bAgain').onclick=()=>{ if(S.last) playRange(S.last.a,S.last.b); };
$('bStop').onclick=()=>{ stop(); if(S.loop){ S.loop=false; $('bLoop').setAttribute('aria-pressed',false); } updDock(); };
$('bNew').onclick=()=>{ stop(); tStop(); $('file').value=''; show('drop'); };
$('bTrim').onclick=()=>{ stop(); openTrim(); };

// ---------- Tria el tros ----------
const T={ src:null, t0:0, off:0, pos:0, end:null, drag:null };
function openTrim(){
  $('trimName').textContent=S.name;
  $('tDur').textContent=fmtT(S.an.dur);
  // silueta d'energia (només orientativa)
  const A=S.an, N=Math.min(160, Math.max(40, Math.round(A.dur))), bars=$('bars'); bars.innerHTML='';
  const per=A.n/N, lo=A.floor, hi=A.peak;
  for(let k=0;k<N;k++){
    let m=0,c=0; for(let i=Math.floor(k*per);i<Math.floor((k+1)*per);i++){ m+=A.db[i]; c++; }
    const v=Math.max(0,Math.min(1,((c?m/c:lo)-lo)/(hi-lo||1)));
    const el=document.createElement('i'); el.style.height=(8+v*92)+'%'; bars.appendChild(el);
  }
  T.pos=S.region.a; show('trim'); drawTrim();
}
const tNow=()=> T.src ? Math.min(S.an.dur, T.off + (S.ctx.currentTime-T.t0)) : T.pos;
function drawTrim(){
  const D=S.an.dur, R=S.region, pc=t=>(100*t/D)+'%';
  $('reg').style.left=pc(R.a); $('reg').style.width=(100*(R.b-R.a)/D)+'%';
  $('ha').style.left=pc(R.a); $('hb').style.left=pc(R.b);
  const t=tNow(); $('phead').style.left=pc(t); $('tNow').textContent=fmtT(t);
  $('vA').textContent=fmtT(R.a); $('vB').textContent=fmtT(R.b);
  const bs=$('bars').children, n=bs.length;
  for(let k=0;k<n;k++){ const c=(k+.5)/n*D; bs[k].classList.toggle('in', c>=R.a && c<=R.b); }
  $('tPlay').innerHTML = T.src ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
                               : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
}
function tPlayFrom(t, end){
  const ctx=getCtx(); tStop(true);
  t=Math.max(0,Math.min(S.an.dur-0.05,t));
  const src=ctx.createBufferSource(); src.buffer=S.buf; src.connect(ctx.destination);
  T.t0=ctx.currentTime+0.02; T.off=t; T.end=end||null;
  end ? src.start(T.t0,t,Math.max(0.05,end-t)) : src.start(T.t0,t);
  T.src=src; src.onended=()=>{ if(T.src===src){ T.pos=tNow(); T.src=null; drawTrim(); } };
  drawTrim(); requestAnimationFrame(tLoop);
}
function tStop(keep){ if(T.src){ T.pos=tNow(); const s=T.src; T.src=null; try{s.onended=null;s.stop();}catch(e){} } if(!keep) drawTrim(); }
function tLoop(){ if(!T.src) return; drawTrim(); requestAnimationFrame(tLoop); }
function setMark(which,t){
  const R=S.region, D=S.an.dur; t=Math.max(0,Math.min(D,t));
  if(which==='a'){ R.a=Math.min(t, R.b-1); } else { R.b=Math.max(t, R.a+1); }
  drawTrim();
}
$('tPlay').onclick=()=>{ T.src ? tStop() : tPlayFrom(T.pos>=S.an.dur-0.1?0:T.pos); };
$('tBack').onclick=()=>{ const t=tNow()-5; T.src ? tPlayFrom(t) : (T.pos=Math.max(0,t), drawTrim()); };
$('tFwd').onclick=()=>{ const t=tNow()+5; T.src ? tPlayFrom(t) : (T.pos=Math.min(S.an.dur,t), drawTrim()); };
$('mA').onclick=()=>{ const t=tNow(); if(S.region.b<=t+1) S.region.b=Math.min(S.an.dur,t+20); setMark('a',t); };
$('mB').onclick=()=>{ setMark('b',tNow()); tStop(); };
document.querySelectorAll('.nud button').forEach(b=>b.onclick=()=>{
  const [w,d]=b.dataset.n.split(','); const R=S.region;
  setMark(w,(w==='a'?R.a:R.b)+(+d));
  if(w==='a') tPlayFrom(R.a); else tPlayFrom(Math.max(R.a,R.b-3),R.b);   // escolta el punt que has mogut
});
$('tHear').onclick=()=>tPlayFrom(S.region.a,S.region.b);
$('tGo').onclick=()=>{ tStop(); detect(); show('board'); };
$('tAll').onclick=()=>{ tStop(); S.region={a:0,b:S.an.dur}; detect(); show('board'); };
// arrossegar marcadors o tocar la barra per moure't
const tl=$('tl');
tl.addEventListener('pointerdown',e=>{
  const r=tl.getBoundingClientRect(), D=S.an.dur, x=e.clientX-r.left, t=x/r.width*D;
  const xa=S.region.a/D*r.width, xb=S.region.b/D*r.width;
  const da=Math.abs(x-xa), db=Math.abs(x-xb);
  if(Math.min(da,db)<22){ T.drag = da<=db ? 'a':'b'; }
  else { T.drag='seek'; T.src ? tPlayFrom(t) : (T.pos=t, drawTrim()); }
  tl.setPointerCapture(e.pointerId);
});
tl.addEventListener('pointermove',e=>{
  if(!T.drag || T.drag==='seek') return;
  const r=tl.getBoundingClientRect(); setMark(T.drag,(e.clientX-r.left)/r.width*S.an.dur);
});
tl.addEventListener('pointerup',()=>{
  if(T.drag==='a') tPlayFrom(S.region.a);
  else if(T.drag==='b') tPlayFrom(Math.max(S.region.a,S.region.b-3),S.region.b);
  T.drag=null;
});
$('detail').oninput=e=>{ stop(); S.level=+e.target.value; detect(); };
$('file').onchange=e=>loadFile(e.target.files[0]);
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
document.addEventListener('keydown',e=>{
  if($('board').hidden || e.target.tagName==='INPUT') return;
  if(e.key===' '){ e.preventDefault(); S.play ? stop() : (S.last && playRange(S.last.a,S.last.b)); }
  else if(e.key==='Escape') stop();
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    const n=S.phrases.length, cur=S.last?S.last.a:-1;
    const i = e.key==='ArrowRight' ? Math.min(n-1,cur+1) : Math.max(0,cur-1);
    playRange(i,i);
  }
});
// ---------- Sessions desades (IndexedDB, en aquest dispositiu) ----------
const DB={name:'frase-a-frase', st:'sessions'};
function idb(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open(DB.name,1); }catch(e){ return rej(e); }
  r.onupgradeneeded=()=>r.result.createObjectStore(DB.st,{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function tx(mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(DB.st,mode); const st=t.objectStore(DB.st);
  const out=fn(st); t.oncomplete=()=>res(out && out.result!==undefined ? out.result : out); t.onerror=()=>rej(t.error); }); }
let saveT=null;
function save(){
  if(!S.blob || !S.an) return;
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const rec={ id:S.sid, name:S.name, blob:S.blob, region:{a:S.region.a,b:S.region.b}, level:S.level,
                dur:S.an.dur, n:S.phrases.length, saved:Date.now() };
    try{ await tx('readwrite', st=>st.put(rec)); toast('Desat'); }
    catch(e){ console.warn('No es pot desar',e); }
  },600);
}
async function renderLib(){
  let all=[]; try{ all = await tx('readonly', st=>st.getAll()); }catch(e){}
  all=(all||[]).sort((a,b)=>b.saved-a.saved);
  const lib=$('lib'), list=$('libList'); list.innerHTML='';
  lib.hidden = !all.length || $('drop').hidden; $('drop').classList.toggle('small', all.length>0);
  all.forEach(r=>{
    const whole = r.region.a<0.5 && r.region.b>r.dur-0.5;
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<button class="open"><span class="ic">'+(r.n||'·')+'</span><span class="tx"><b></b><span></span></span></button><button class="del" aria-label="Esborra">✕</button>';
    el.querySelector('b').textContent=r.name;
    el.querySelector('.tx span').textContent=(r.n?r.n+' frases · ':'')+(whole?fmtT(r.dur):'solo de '+fmtT(r.region.a)+' a '+fmtT(r.region.b))+' · '+ago(r.saved);
    el.querySelector('.open').onclick=()=>loadFile(r.blob, r);
    const del=el.querySelector('.del');
    del.onclick=async()=>{
      if(!del.classList.contains('sure')){ del.classList.add('sure'); del.textContent='Esborra'; setTimeout(()=>{del.classList.remove('sure');del.textContent='✕';},3000); return; }
      try{ await tx('readwrite', st=>st.delete(r.id)); }catch(e){} renderLib();
    };
    list.appendChild(el);
  });
}
function ago(t){ const d=(Date.now()-t)/1000; if(d<90) return 'ara mateix'; if(d<3600) return 'fa '+Math.round(d/60)+' min';
  if(d<86400) return 'fa '+Math.round(d/3600)+' h'; const n=Math.round(d/86400); return n===1?'ahir':'fa '+n+' dies'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1200); }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
renderLib();

// Prova automàtica: window.__frase
window.__frase = S;
</script>
