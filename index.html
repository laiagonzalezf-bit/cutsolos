<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="cutsolos">
<title>cutsolos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#8A8A8E; --soft:#F2F2F4; --line:#E5E5EA;
  --pad:#F2F2F4; --pad-ink:#111111; --pad-sub:#9A9A9F; --lit:#111111; --lit-ink:#FFFFFF; --accent:#111111;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#000000; --ink:#F5F5F7; --muted:#8E8E93; --soft:#1C1C1E; --line:#2C2C2E;
    --pad:#1C1C1E; --pad-ink:#F5F5F7; --pad-sub:#7C7C80; --lit:#F5F5F7; --lit-ink:#000000; --accent:#F5F5F7; }
}
:root[data-theme="dark"]{ --bg:#000000; --ink:#F5F5F7; --muted:#8E8E93; --soft:#1C1C1E; --line:#2C2C2E;
  --pad:#1C1C1E; --pad-ink:#F5F5F7; --pad-sub:#7C7C80; --lit:#F5F5F7; --lit-ink:#000000; --accent:#F5F5F7; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;gap:12px;padding:14px 20px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.topbar h1{margin:0;display:flex;align-items:center;gap:8px;font-size:21px;font-weight:400;letter-spacing:-.04em;line-height:1}
.topbar h1 b{font-weight:800}
.mark-logo{width:24px;height:24px}
.topbar .grow{flex:1}
.topbar button{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--ink);border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.topbar button svg{width:20px;height:20px}

main{flex:1;display:flex;flex-direction:column;padding:8px 20px 20px;gap:18px}

/* inici */
.drop{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;border:1.5px dashed var(--line);border-radius:32px;padding:32px 24px;cursor:pointer}
.drop.over{background:var(--soft)}
.drop .big{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.drop .big svg{width:24px;height:24px}
.drop h2{font-size:22px;font-weight:600;margin:0;letter-spacing:-.02em}
.drop p{margin:0;color:var(--muted);max-width:30ch;font-size:15px}
.drop .cta{font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 24px;font-size:16px;margin-top:4px}
.drop.small{flex:none;min-height:0;padding:16px;gap:8px;flex-direction:row;justify-content:center}
.drop.small .big,.drop.small p,.drop.small h2{display:none}
.drop.small .cta{margin:0}

.busy{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);min-height:300px;font-size:15px}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px}

/* llista */
.lib h2{font-size:28px;font-weight:700;margin:4px 0 12px;letter-spacing:-.02em}
#libList{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.item .open{flex:1;min-width:0;text-align:left;color:var(--ink);background:none;border:0;padding:14px 0;cursor:pointer;display:flex;align-items:center;gap:14px}
.item .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.item .tx{min-width:0}
.item .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:13px;color:var(--muted)}
.item .del{flex:none;font-size:14px;border:0;background:none;color:var(--muted);padding:10px 4px 10px 14px;cursor:pointer}
.item .del.sure{color:#FF3B30;font-weight:600}

/* capçalera de la cançó */
.song{display:flex;align-items:center;gap:12px}
.song .name{flex:1;min-width:0}
.song .name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:22px;font-weight:700;letter-spacing:-.02em}
.song .name span{color:var(--muted);font-size:14px}

/* pads */
.pad-wrap{margin-top:4px}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (min-width:430px){.pads{grid-template-columns:repeat(4,1fr)}}
.pad{position:relative;aspect-ratio:1;border:0;border-radius:50%;background:var(--pad);color:var(--pad-ink);cursor:pointer;overflow:hidden;padding:0;
  transition:transform .08s ease;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad:active{transform:scale(.95)}
.pad .fill{position:absolute;inset:0;background:var(--lit);transform-origin:left;transform:scaleX(var(--p,0));opacity:0}
.pad .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pad .n{position:relative;font-size:clamp(26px,8vw,36px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pad .d{position:relative;font-size:11px;color:var(--pad-sub);font-variant-numeric:tabular-nums}
.pad .t{display:none}
.pad.on .fill{opacity:1}
.pad.on .n,.pad.on .d{color:#FFFFFF;mix-blend-mode:difference}
.pad.on{box-shadow:0 0 0 2px var(--lit)}
.pad.sel{box-shadow:0 0 0 2px var(--ink)}
.pad.picking{background:var(--ink);color:var(--bg)}
.pad.picking .d{color:var(--bg);opacity:.6}
.pads{-webkit-touch-callout:none}
@keyframes bl{50%{opacity:.2}}

.hint{color:var(--muted);font-size:14px;text-align:center;margin:0;min-height:1.4em}
.hint b{color:var(--ink);font-weight:600}

/* controls */
.row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.row .lbl{width:58px;flex:none;color:var(--ink);font-weight:500}
.detail input{flex:1;accent-color:var(--ink);height:28px}
.tempo .val{flex:1;text-align:center;color:var(--ink);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.1}
.tempo .val small{display:block;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tempo{gap:8px}
.chip{font-size:15px;font-weight:500;border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:disabled{opacity:.35}

/* barra inferior */
.dock{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:4px}
.dock button{flex:1;font-weight:500;font-size:11px;border:0;border-radius:999px;background:none;color:var(--muted);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1}
.dock button svg{width:24px;height:24px}
.dock button[aria-pressed="true"]{color:var(--ink);background:var(--soft)}
.dock button:not(:disabled){color:var(--ink)}
.dock button:disabled{opacity:.3}

/* triar el tros */
.trim{display:flex;flex-direction:column;gap:16px}
.trim .song span{display:block}
.tl{position:relative;height:84px;border-radius:42px;background:var(--soft);overflow:hidden;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.bars{position:absolute;inset:12px 0;display:flex;align-items:center;gap:1px;padding:0 2px}
.bars i{flex:1;background:var(--line);border-radius:1px;min-height:2px}
.bars i.in{background:var(--ink)}
.reg{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 6%,transparent);pointer-events:none}
.h{position:absolute;top:0;bottom:0;width:30px;margin-left:-15px;display:flex;justify-content:center;cursor:ew-resize}
.h span{width:2px;height:100%;background:var(--ink);position:relative}
.h span::before{content:"";position:absolute;top:50%;left:50%;width:14px;height:28px;margin:-14px 0 0 -7px;background:var(--bg);border:2px solid var(--ink);border-radius:7px}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#FF3B30;pointer-events:none}
.tlt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-10px;font-variant-numeric:tabular-nums}
.tp{display:flex;align-items:center;justify-content:center;gap:14px}
.round{width:60px;height:60px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.round svg{width:26px;height:26px}
.pill{font-size:15px;font-weight:500;border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.wide{width:100%;padding:12px}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk{display:flex;flex-direction:column;gap:8px}
.mark{font-size:15px;font-weight:600;line-height:1.2;min-height:54px;border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink);padding:10px;cursor:pointer}
.mark:active{background:var(--ink);color:var(--bg)}
.nud{display:flex;align-items:center;justify-content:space-between;gap:6px}
.nud b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.nud button{font-size:13px;font-weight:500;border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 10px;cursor:pointer}
.go{font-size:17px;font-weight:600;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:16px;cursor:pointer}
.link{font-size:14px;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px}

.toast{white-space:nowrap;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:500;font-size:14px;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:.92}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 10px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="logo"><svg class="mark-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2.5a9.5 9.5 0 0 0 0 19z" fill="currentColor"/><path d="M13 0.5a9.5 9.5 0 0 1 0 19z" fill="currentColor" opacity=".35"/></svg><span>cut<b>solos</b></span></h1>
    <span class="grow"></span>
    <button id="bNew" hidden aria-label="Nou àudio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <main>
    <!-- 0. Cançons desades -->
    <section id="lib" class="lib" hidden>
      <h2>Les meves cançons</h2>
      <div id="libList"></div>
    </section>

    <!-- 1. Penja l'àudio -->
    <label class="drop" id="drop" for="file">
      <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
      <h2>Penja una cançó</h2>
      <span class="cta">Tria l'àudio</span>
      <input id="file" class="sr" type="file" accept="audio/*,video/mp4,.mp3,.m4a,.wav,.aac,.ogg,.flac,.aif,.aiff">
    </label>

    <!-- 2. Processant -->
    <div class="busy" id="busy" hidden><div class="spin"></div><div id="busyMsg">Buscant les frases…</div></div>
    <div class="err" id="err" hidden></div>

    <!-- 3. Tria el tros del solo -->
    <section id="trim" class="trim" hidden>
      <div class="song"><div class="name"><b id="trimName"></b></div></div>

      <div class="tl" id="tl" aria-label="Cançó">
        <div class="bars" id="bars"></div>
        <div class="reg" id="reg"></div>
        <div class="h ha" id="ha" aria-label="Inici del solo"><span></span></div>
        <div class="h hb" id="hb" aria-label="Final del solo"><span></span></div>
        <div class="ph" id="phead"></div>
      </div>
      <div class="tlt"><span id="tNow">0:00</span><span id="tDur"></span></div>

      <div class="tp">
        <button class="round" id="tPlay" aria-label="Reprodueix"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <button class="pill" id="tBack">−5 s</button>
        <button class="pill" id="tFwd">+5 s</button>
      </div>

      <div class="marks">
        <div class="mk">
          <button class="mark" id="mA">El solo comença aquí</button>
          <div class="nud"><button data-n="a,-1">−1 s</button><b id="vA">0:00</b><button data-n="a,1">+1 s</button></div>
        </div>
        <div class="mk">
          <button class="mark" id="mB">Acaba aquí</button>
          <div class="nud"><button data-n="b,-1">−1 s</button><b id="vB">0:00</b><button data-n="b,1">+1 s</button></div>
        </div>
      </div>

      <button class="pill wide" id="tHear">▶ Escolta només el tros triat</button>
      <button class="go" id="tGo">Talla el solo en frases</button>
      <button class="link" id="tAll">Fes servir tota la cançó</button>
    </section>

    <!-- 4. Pads -->
    <section id="board" hidden>
      <div class="song" style="margin-bottom:12px">
        <div class="name"><b id="songName"></b><span id="songInfo"></span></div>
        <button class="pill" id="bTrim">Tros</button>
      </div>
      <div class="pad-wrap"><div class="pads" id="pads" role="group" aria-label="Frases"></div></div>
      <div class="row tempo" style="margin-top:6px">
        <button class="chip" id="rDown">−0,15</button>
        <span class="val"><small>Tempo</small><span id="rVal">1,00×</span></span>
        <button class="chip" id="rUp">+0,15</button>
        <button class="chip" id="rReset">Original</button>
      </div>
      <div class="row detail">
        <span class="lbl">Frases</span>
        <span>llargues</span>
        <input id="detail" type="range" min="0" max="4" step="1" value="2" aria-label="Llargada de les frases">
        <span>curtes</span>
      </div>
    </section>
  </main>

  <nav class="dock" id="dock" hidden>
    <button id="bLoop" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      Repeteix
    </button>
    <button id="bAgain" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
      Torna-hi
    </button>
    <button id="bStop" class="stop" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Atura
    </button>
  </nav>
  <div class="toast" id="toast">Desat</div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const S = { ctx:null, buf:null, name:'', an:null, phrases:[], level:2,
            rate:1, sel:null, loop:false, last:null, play:null };

// ---------- Lectura de l'àudio ----------
function getCtx(){
  if(!S.ctx){ const C = window.AudioContext||window.webkitAudioContext; S.ctx = new C(); }
  if(S.ctx.state==='suspended') S.ctx.resume();
  return S.ctx;
}
async function loadFile(f, rec){
  if(!f) return;
  stop(); show('busy'); $('busyMsg').textContent='Llegint l\'àudio…';
  try{
    const ctx = getCtx();
    const ab = await f.arrayBuffer();
    const buf = await new Promise((res,rej)=>{ const p = ctx.decodeAudioData(ab, res, rej); if(p&&p.catch) p.catch(rej); });
    S.buf = buf; S.name = rec ? rec.name : (f.name||'Cançó').replace(/\.[^.]+$/,'');
    S.blob = f; S.sid = rec ? rec.id : 's'+Date.now();
    $('busyMsg').textContent='Buscant les frases…';
    await new Promise(r=>setTimeout(r,30));
    S.an = await analyse(buf);
    S.sel=null; S.last=null; stretchCache.clear();
    if(rec){
      S.region = rec.region || {a:0,b:buf.duration};
      S.level = rec.level ?? 2; $('detail').value = S.level; setRate(rec.rate||1, true);
      detect(); show('board');
    } else {
      S.region={a:0,b:buf.duration}; S.level=2; $('detail').value=2; setRate(1, true);
      if(buf.duration > 75){ openTrim(); save(); }   // cançó sencera: primer tria el tros
      else { detect(); show('board'); }
    }
  }catch(e){
    console.error(e);
    show('drop');
    const err=$('err'); err.hidden=false;
    err.textContent='No he pogut llegir aquest fitxer. Prova amb un MP3, M4A o WAV.';
  }
}

// ---------- Anàlisi ----------
// Energia de la banda on viuen els instruments melòdics (180 Hz – 5 kHz), en trames de 10 ms.
async function analyse(buf){
  const sr = buf.sampleRate;
  let x;
  try{
    const OC = window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const off = new OC(1, buf.length, sr);
    const src = off.createBufferSource(); src.buffer = buf;
    const hp = off.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180; hp.Q.value=0.7;
    const lp = off.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5000; lp.Q.value=0.7;
    src.connect(hp); hp.connect(lp); lp.connect(off.destination); src.start();
    x = (await off.startRendering()).getChannelData(0);
  }catch(e){
    // reserva: mescla sense filtrar
    x = new Float32Array(buf.length);
    for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i++) x[i]+=d[i]/buf.numberOfChannels; }
  }
  const hop = Math.round(sr*0.01), win = hop*3;
  const cs = new Float64Array(x.length+1);
  for(let i=0;i<x.length;i++) cs[i+1]=cs[i]+x[i]*x[i];
  const n = Math.max(1, Math.floor((x.length-win)/hop)+1);
  const raw = new Float32Array(n);
  for(let i=0;i<n;i++){ const a=i*hop; raw[i]=10*Math.log10((cs[a+win]-cs[a])/win+1e-12); }
  const db = movAvg(raw,2);       // ±20 ms
  const slow = movAvg(raw,8);     // ±80 ms, per trobar valls
  const sorted = Float32Array.from(db).sort();
  const pct = p => sorted[Math.min(n-1,Math.max(0,Math.floor(p*(n-1))))];
  const floor = pct(0.08), peak = pct(0.98);
  const lmax = movMax(db,75);     // màxim local ±0,75 s
  return { sr, hop, win, n, db, slow, lmax, floor, peak, dur: buf.duration };
}
function movAvg(a,h){ const n=a.length,o=new Float32Array(n),cs=new Float64Array(n+1); for(let i=0;i<n;i++)cs[i+1]=cs[i]+a[i];
  for(let i=0;i<n;i++){const lo=Math.max(0,i-h),hi=Math.min(n,i+h+1);o[i]=(cs[hi]-cs[lo])/(hi-lo);} return o; }
function movMax(a,h){ const n=a.length,o=new Float32Array(n),dq=[]; let head=0;
  for(let j=0;j<n+h;j++){
    if(j<n){ while(dq.length>head && a[dq[dq.length-1]]<=a[j]) dq.pop(); dq.push(j); }
    const i=j-h; if(i<0) continue; if(i>=n) break;
    while(dq[head]<i-h) head++;
    o[i]=a[dq[head]];
  } return o; }

// ---------- Frases ----------
// 0 = frases llargues … 4 = frases curtes
const LEVELS = [
  {depth:20, absK:.18, gap:.40, minLen:2.0, maxLen:14},
  {depth:16, absK:.20, gap:.30, minLen:1.4, maxLen:10},
  {depth:13, absK:.22, gap:.22, minLen:1.0, maxLen:7},
  {depth:10, absK:.25, gap:.16, minLen:.7,  maxLen:5},
  {depth:8,  absK:.28, gap:.12, minLen:.5,  maxLen:3.5},
];
function detect(){
  const A=S.an, L=LEVELS[S.level], fps=1/0.01;
  const R=S.region||{a:0,b:A.dur};
  const i0=Math.max(0,Math.floor(R.a*fps)), i1=Math.min(A.n,Math.ceil(R.b*fps));
  // llindars calculats només dins del tros triat
  const sub=Float32Array.from(A.db.subarray(i0,Math.max(i0+1,i1))).sort();
  const pct=p=>sub[Math.min(sub.length-1,Math.max(0,Math.floor(p*(sub.length-1))))];
  const floor=pct(0.08), peak=pct(0.98);
  const thr = floor + L.absK*(peak-floor);
  const act = new Uint8Array(A.n);
  for(let i=i0;i<i1;i++) act[i] = (A.db[i]>thr && A.db[i]>A.lmax[i]-L.depth) ? 1:0;
  // trams actius
  let seg=[]; let s=-1;
  for(let i=0;i<=A.n;i++){
    const on = i<A.n && act[i];
    if(on && s<0) s=i;
    if(!on && s>=0){ seg.push([s,i]); s=-1; }
  }
  // uneix silencis curts (articulacions, respiracions breus)
  const gapF = L.gap*fps;
  seg = mergeIf(seg, (a,b)=> b[0]-a[1] < gapF);
  // treu sorolls molt curts i aïllats
  seg = seg.filter((g,k)=>{
    if(g[1]-g[0] >= .25*fps) return true;
    const pv=seg[k-1], nx=seg[k+1];
    return (pv && g[0]-pv[1]<.6*fps) || (nx && nx[0]-g[1]<.6*fps);
  });
  // si no hi ha res a dalt (tot molt pla), parteix el tot
  if(!seg.length) seg=[[i0,i1]];
  // frases massa llargues: talla per la vall més fonda
  let out=[]; for(const g of seg) out.push(...splitLong(g,L));
  // frases massa curtes: enganxa-les a la veïna més propera
  out = absorbShort(out, L.minLen*fps, 1.0*fps);
  // a segons, amb marges
  const sec = i => i*A.hop/A.sr;
  const ph = out.map(([a,b])=>({ s: Math.max(R.a, sec(a)-0.05), e: Math.min(R.b, sec(b)+A.win/A.sr+0.15) }));
  for(let k=1;k<ph.length;k++){ if(ph[k].s < ph[k-1].e){ const m=(ph[k].s+ph[k-1].e)/2; ph[k-1].e=m; ph[k].s=m; } }
  S.phrases = ph; S.sel=null; S.last=null;
  render(); save();
}
function mergeIf(seg, test){
  const o=[]; for(const g of seg){ const p=o[o.length-1]; if(p && test(p,g)) p[1]=g[1]; else o.push([g[0],g[1]]); } return o;
}
function splitLong(g,L){
  const A=S.an, fps=100, len=(g[1]-g[0])/fps;
  if(len <= L.maxLen) return [g];
  const m = Math.max(Math.round(1.2*fps), Math.round((g[1]-g[0])*0.2));
  let best=-1, bv=Infinity;
  for(let i=g[0]+m;i<g[1]-m;i++){
    // vall: energia lenta respecte al màxim local; afavoreix el centre
    const c = Math.abs((i-g[0])/(g[1]-g[0])-0.5);
    const v = A.slow[i]-A.lmax[i] + c*6;
    if(v<bv){ bv=v; best=i; }
  }
  if(best<0) return [g];
  return [...splitLong([g[0],best],L), ...splitLong([best,g[1]],L)];
}
function absorbShort(seg, minF, reachF){
  let changed=true;
  while(changed && seg.length>1){
    changed=false;
    for(let k=0;k<seg.length;k++){
      const g=seg[k]; if(g[1]-g[0] >= minF) continue;
      const pv=seg[k-1], nx=seg[k+1];
      const dp = pv ? g[0]-pv[1] : Infinity, dn = nx ? nx[0]-g[1] : Infinity;
      if(Math.min(dp,dn) > reachF) continue;
      if(dp<=dn){ pv[1]=g[1]; } else { nx[0]=g[0]; }
      seg.splice(k,1); changed=true; break;
    }
  }
  return seg;
}

const fmtR = r => r.toFixed(2).replace('.',',')+'×';
function setRate(r, quiet){

const stretchCache=new Map();
function stretched(s,e,rate){
  const key=s.toFixed(3)+'|'+e.toFixed(3)+'|'+rate;
  if(stretchCache.has(key)) return stretchCache.get(key);
  const sr=S.buf.sampleRate, a=Math.floor(s*sr), b=Math.min(S.buf.length,Math.ceil(e*sr));
  const chs=[]; for(let c=0;c<Math.min(2,S.buf.numberOfChannels);c++) chs.push(S.buf.getChannelData(c).subarray(a,b));
  const out=wsola(chs,rate);
  const buf=S.ctx.createBuffer(out.length,out[0].length,sr); out.forEach((d,i)=>buf.copyToChannel(d,i));
  if(stretchCache.size>30) stretchCache.delete(stretchCache.keys().next().value);
  stretchCache.set(key,buf); return buf;
}
function wsola(chs,rate){
  const n=chs[0].length,N=2048,Hs=512,Ha=Hs*rate,outLen=Math.floor(n/rate),delta=360;
  const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  const mono=new Float32Array(n);for(let i=0;i<n;i++){let v=0;for(const c of chs)v+=c[i];mono[i]=v/chs.length}
  const outs=chs.map(()=>new Float32Array(outLen+N)),norm=new Float32Array(outLen+N);
  let prevIn=-1;
  for(let k=0;(k*Hs)<outLen;k++){
    const nominal=Math.round(k*Ha);let best=nominal;
    if(prevIn>=0){const target=prevIn+Hs;let bc=-Infinity;
      for(let d=-delta;d<=delta;d+=4){const cand=nominal+d;if(cand<0||cand+N>n||target+N>n)continue;let c=0;for(let i=0;i<N;i+=4)c+=mono[cand+i]*mono[target+i];if(c>bc){bc=c;best=cand}}}
    if(best+N>n)best=Math.max(0,n-N);
    const o=k*Hs;
    for(let ci=0;ci<chs.length;ci++){const x=chs[ci],y=outs[ci];for(let i=0;i<N&&o+i<y.length;i++)y[o+i]+=x[best+i]*win[i]}
    for(let i=0;i<N&&o+i<norm.length;i++)norm[o+i]+=win[i];
    prevIn=best;
  }
  return outs.map(y=>{const z=new Float32Array(outLen);for(let i=0;i<outLen;i++)z[i]=norm[i]>1e-3?y[i]/norm[i]:0;return z});
}

// ---------- So ----------
function playRange(a,b){
  const ctx=getCtx(); stop(true);
  const s=S.phrases[a].s, e=S.phrases[b].e, rate=S.rate;
  const src=ctx.createBufferSource();
  let off=s, dur=e-s;
  if(rate!==1){ src.buffer=stretched(s,e,rate); off=0; dur=src.buffer.duration; } else src.buffer=S.buf;
  const g=ctx.createGain(); src.connect(g); g.connect(ctx.destination);
  const t0=ctx.currentTime+0.03, f=0.012;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(1,t0+f);
  g.gain.setValueAtTime(1,t0+dur-f); g.gain.linearRampToValueAtTime(0,t0+dur);
  src.start(t0, off, dur);
  const P={src,a,b,t0,s,dur,rate}; S.play=P; S.last={a,b};
  src.onended=()=>{
    if(S.play!==P) return;
    clearLit(); S.play=null;
    if(S.loop){ S.loopTimer=setTimeout(()=>{ if(!S.play && S.loop && S.last && S.last.a===a && S.last.b===b) playRange(a,b); },350); }
    updDock();
  };
  paintSel(); updDock(); requestAnimationFrame(tick);
}
function stop(silent){
  clearTimeout(S.loopTimer);
  if(S.play){ const P=S.play; S.play=null; try{P.src.onended=null;P.src.stop();}catch(e){} }
  clearLit(); if(!silent) updDock();
}
function clearLit(){ document.querySelectorAll('.pad.on').forEach(el=>{el.classList.remove('on');el.style.removeProperty('--p');}); }
function tick(){
  const P=S.play; if(!P) return;
  const t = P.s + Math.max(0, S.ctx.currentTime-P.t0)*P.rate;
  const pads=$('pads').children;
  for(let i=P.a;i<=P.b;i++){
    const ph=S.phrases[i], el=pads[i]; if(!el) continue;
    const p=Math.min(1,Math.max(0,(t-ph.s)/(ph.e-ph.s)));
    el.classList.toggle('on', t>=ph.s-0.02 && t<ph.e);
    el.style.setProperty('--p', p.toFixed(3));
  }
  requestAnimationFrame(tick);
}
function updDock(){
  $('bStop').disabled = !S.play && !S.loop;
  $('bAgain').disabled = !S.last;
}

function endGesture(e, cancel){
  if(e.pointerId!==G.id) return;

const T={ src:null, t0:0, off:0, pos:0, end:null, drag:null };
function openTrim(){
  $('trimName').textContent=S.name;
  $('tDur').textContent=fmtT(S.an.dur);
  // silueta d'energia (només orientativa)
  const A=S.an, N=Math.min(160, Math.max(40, Math.round(A.dur))), bars=$('bars'); bars.innerHTML='';
  const per=A.n/N, lo=A.floor, hi=A.peak;
  for(let k=0;k<N;k++){
    let m=0,c=0; for(let i=Math.floor(k*per);i<Math.floor((k+1)*per);i++){ m+=A.db[i]; c++; }
    const v=Math.max(0,Math.min(1,((c?m/c:lo)-lo)/(hi-lo||1)));

  }

}
const tNow=()=> T.src ? Math.min(S.an.dur, T.off + (S.ctx.currentTime-T.t0)) : T.pos;
function drawTrim(){

function tPlayFrom(t, end){
  const ctx=getCtx(); tStop(true);

  const src=ctx.createBufferSource(); src.buffer=S.buf; src.connect(ctx.destination);
  T.t0=ctx.currentTime+0.02; T.off=t; T.end=end||null;
  end ? src.start(T.t0,t,Math.max(0.05,end-t)) : src.start(T.t0,t);

}

// ---------- Sessions desades (IndexedDB, en aquest dispositiu) ----------
const DB={name:'frase-a-frase', st:'sessions'};
function idb(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open(DB.name,1); }catch(e){ return rej(e); }
  r.onupgradeneeded=()=>r.result.createObjectStore(DB.st,{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function tx(mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(DB.st,mode); const st=t.objectStore(DB.st);
  const out=fn(st); t.oncomplete=()=>res(out && out.result!==undefined ? out.result : out); t.onerror=()=>rej(t.error); }); }
let saveT=null;
function save(){
  if(!S.blob || !S.an) return;
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const rec={ id:S.sid, name:S.name, blob:S.blob, region:{a:S.region.a,b:S.region.b}, level:S.level, rate:S.rate,
                dur:S.an.dur, n:S.phrases.length, saved:Date.now() };
    try{ await tx('readwrite', st=>st.put(rec)); if(S.toasted!==S.sid){ S.toasted=S.sid; toast('Desat'); } }
    catch(e){ console.warn('No es pot desar',e); }
  },600);
}
async function renderLib(){

  const lib=$('lib'), list=$('libList'); list.innerHTML='';
  lib.hidden = !all.length || $('drop').hidden; $('drop').classList.toggle('small', all.length>0);
  all.forEach(r=>{
    const whole = r.region.a<0.5 && r.region.b>r.dur-0.5;
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<button class="open"><span class="ic">'+(r.n||'·')+'</span><span class="tx"><b></b><span></span></span></button><button class="del" aria-label="Esborra">✕</button>';
    el.querySelector('b').textContent=r.name;
    el.querySelector('.tx span').textContent=(r.n?r.n+' frases · ':'')+(whole?fmtT(r.dur):'solo de '+fmtT(r.region.a)+' a '+fmtT(r.region.b))+(r.rate&&r.rate!==1?' · '+fmtR(r.rate):'')+' · '+ago(r.saved);
    el.querySelector('.open').onclick=()=>loadFile(r.blob, r);
    const del=el.querySelector('.del');
    del.onclick=async()=>{
      if(!del.classList.contains('sure')){ del.classList.add('sure'); del.textContent='Esborra'; setTimeout(()=>{del.classList.remove('sure');del.textContent='✕';},3000); return; }
      try{ await tx('readwrite', st=>st.delete(r.id)); }catch(e){} renderLib();
    };
    list.appendChild(el);
  });
}
function ago(t){ const d=(Date.now()-t)/1000; if(d<90) return 'ara mateix'; if(d<3600) return 'fa '+Math.round(d/60)+' min';
  if(d<86400) return 'fa '+Math.round(d/3600)+' h'; const n=Math.round(d/86400); return n===1?'ahir':'fa '+n+' dies'; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1200); }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
renderLib();

if('serviceWorker' in navigator && location.protocol==='https:' && /github\.io$/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
